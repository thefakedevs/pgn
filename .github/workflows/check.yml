name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python safety and rollback tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate configurations and prepare the official release image
        run: |
          cp .env.example .env
          sed -i 's/vpn.example.com/node.example.net/g; s@/assets/change-me/@/assets/fixture/@' .env
          sudo ./pgn check
          sudo ./pgn maintenance-install
          sudo sed -i 's/MAINTENANCE_ENABLED=false/MAINTENANCE_ENABLED=true/' .env
          sudo ./pgn check
      - name: Official service and shared TLS ingress
        run: |
          python3 -m venv /tmp/pgn-test-venv
          /tmp/pgn-test-venv/bin/pip install h2==4.3.0
          sudo /tmp/pgn-test-venv/bin/python tests/ingress.py

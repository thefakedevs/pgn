name: Access logs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: docker build -t pgn-postgres-test tests/integration
      - run: python tests/integration/access_logs.py

name: ${COMPOSE_PROJECT_NAME:-pgn}

services:
  pg-node:
    image: pasarguard/node:v0.5.6
    restart: unless-stopped
    network_mode: host
    environment:
      API_KEY: ${API_KEY:?Run ./pgn prepare first}
      NODE_HOST: "127.0.0.1"
      SERVICE_PORT: "62050"
      SERVICE_PROTOCOL: grpc
      SSL_CERT_FILE: /var/lib/pg-node/certs/ssl_cert.pem
      SSL_KEY_FILE: /var/lib/pg-node/certs/ssl_key.pem
      GENERATED_CONFIG_PATH: /var/lib/pg-node/generated
    volumes:
      - ./state/node:/var/lib/pg-node
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haproxy:
    image: haproxy:3.2.24-alpine
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pg-node
    labels:
      pgn.config-revision: ${PGN_CONFIG_REVISION:-manual}
    volumes:
      - ./config:/usr/local/etc/haproxy:ro
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    network_mode: host
    labels:
      pgn.config-revision: ${PGN_CONFIG_REVISION:-manual}
    volumes:
      - ./config:/etc/caddy:ro
      - ./site:/srv:ro
      - ./state/caddy/data:/data
      - ./state/caddy/config:/config
    logging: *logging

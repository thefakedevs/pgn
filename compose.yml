name: ${COMPOSE_PROJECT_NAME:-pgn}

services:
  geofiles:
    build:
      context: .
      dockerfile: docker/geofiles.Dockerfile
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-pgn}
      GEOFILES_UPDATE_INTERVAL: ${GEOFILES_UPDATE_INTERVAL:-21600}
      GEOFILES_RELOAD_AT: ${GEOFILES_RELOAD_AT:-02:00}
      GEOFILES_TIMEZONE: ${GEOFILES_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./state/geofiles:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "/app/geofiles.py", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 120
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vector:
    image: timberio/vector:0.61.0-debian
    profiles: [access-logs]
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      ACCESS_LOG_POSTGRES_DSN: ${ACCESS_LOG_POSTGRES_DSN:-postgres://disabled@localhost/disabled?sslmode=verify-full}
      ACCESS_LOG_NODE_ID: ${ACCESS_LOG_NODE_ID:-disabled}
      ACCESS_LOG_BUFFER_BYTES: ${ACCESS_LOG_BUFFER_BYTES:-1073741824}
      # Vector >=0.57 requires explicit opt-in for the DSN reference in our static config.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      TZ: UTC
    labels:
      pgn.vector-revision: ${PGN_VECTOR_REVISION:-manual}
    volumes:
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
      - ./config/postgres-ca.pem:/etc/vector/postgres-ca.pem:ro
      - ./state/node/logs:/var/log/xray:ro
      - ./state/vector:/var/lib/vector
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pg-node:
    image: pasarguard/node:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      geofiles:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:?Run ./pgn prepare first}
      NODE_HOST: "127.0.0.1"
      SERVICE_PORT: "62050"
      SERVICE_PROTOCOL: grpc
      SSL_CERT_FILE: /var/lib/pg-node/certs/ssl_cert.pem
      SSL_KEY_FILE: /var/lib/pg-node/certs/ssl_key.pem
      GENERATED_CONFIG_PATH: /var/lib/pg-node/generated
      XRAY_ASSETS_PATH: /usr/local/share/xray/current
      TZ: UTC
    volumes:
      - ./state/node:/var/lib/pg-node
      - ./state/geofiles:/usr/local/share/xray:ro
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haproxy:
    image: haproxy:latest
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pg-node
    labels:
      pgn.config-revision: ${PGN_CONFIG_REVISION:-manual}
    volumes:
      - ./config:/usr/local/etc/haproxy:ro
    logging: *logging

  caddy:
    image: caddy:latest
    restart: unless-stopped
    network_mode: host
    labels:
      pgn.config-revision: ${PGN_CONFIG_REVISION:-manual}
    volumes:
      - ./config:/etc/caddy:ro
      - ./site:/srv:ro
      - ./state/caddy/data:/data
      - ./state/caddy/config:/config
    logging: *logging

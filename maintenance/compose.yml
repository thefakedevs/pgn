services:
  maintenance:
    image: local/pgn-maintenance:0.0.4
    build: ${PGN_ROOT:?Use ./pgn}/state/maintenance/image
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?Run ./pgn prepare first}
      API_PORT: "3000"
      APP_NAME: ${PGN_ROOT}/pgn
      SSL_CERT_FILE: ${PGN_ROOT}/state/node/certs/ssl_cert.pem
      SSL_KEY_FILE: ${PGN_ROOT}/state/node/certs/ssl_key.pem
    ports:
      - "127.0.0.1:62051:3000"
    volumes:
      # Same absolute path is required for host Docker bind mounts/build contexts.
      - ${PGN_ROOT}:${PGN_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${PGN_ROOT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
